name: Release

# `pnpm release` bumps the version, commits, tags `v*` and pushes: the tag publishes.
on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing, with provenance
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      # Trusted publishing: no token. The package is linked to this workflow once (CONTRIBUTING.md).
      # Before the GitHub release: a failed publish leaves no release behind.
      - name: Publish to npm
        run: npx npm@latest publish --provenance --access public
      - name: GitHub release
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
