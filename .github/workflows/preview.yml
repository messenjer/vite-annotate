name: Preview

# Every pull request and every push to main publishes an installable build on pkg.pr.new:
#   pnpm add -D https://pkg.pr.new/vite-annotate@<sha>
# Needs the pkg.pr.new GitHub App installed on the repository.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # `--previewVersion`: 0.0.0-preview-<sha>, so a preview never shadows a real release in a lockfile.
      - run: pnpm exec pkg-pr-new publish --previewVersion --commentWithDev
